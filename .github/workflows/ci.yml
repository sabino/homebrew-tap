name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tap checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate updater policy and recipe syntax
        run: |
          python3 -m unittest discover -s Tests -v
          ruby -c Casks/audifern.rb
          bash -n scripts/check-install.sh
      - name: Validate workflow syntax
        env:
          GOMAXPROCS: '2'
        run: |
          go install -p 2 github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  install:
    name: Install Audifern
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Ensure the public-key verifier is available
        run: command -v gpg || brew install gnupg
      - name: Verify the pinned official release
        run: python3 scripts/update_audifern.py --check
      - name: Audit and install the cask without launching the app
        run: bash scripts/check-install.sh
