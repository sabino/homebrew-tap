name: Update Audifern

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-audifern
  cancel-in-progress: false

jobs:
  discover:
    name: Look for a new release
    if: github.repository == 'sabino/homebrew-tap' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_audifern.py --probe

  prepare:
    name: Verify the latest stable release
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the trusted updater
        run: python3 -m unittest discover -s Tests -v
      - name: Ensure the public-key verifier is available
        run: command -v gpg || brew install gnupg
      - id: candidate
        name: Verify and prepare the latest release
        run: python3 scripts/update_audifern.py --candidate "$RUNNER_TEMP/candidate.json"
      - name: Audit and install the exact candidate
        if: steps.candidate.outputs.changed == 'true'
        run: bash scripts/check-install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: verified-cask-candidate
          path: ${{ runner.temp }}/candidate.json
          if-no-files-found: error
          retention-days: 7

  propose:
    name: Propose the verified cask update
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-cask-candidate
          path: ${{ runner.temp }}/candidate
      - name: Create a GitHub-signed cask commit and check-gated pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_update.py "$RUNNER_TEMP/candidate/candidate.json"
